naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Flow REST API"
  description: "REST API for managing and executing Salesforce Flow automation processes, interviews, and invocable actions."
  tags:
    - Salesforce
    - Flow
    - Automation
    - Workflow
    - Business Process
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_ACCESS_TOKEN: SALESFORCE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: salesforce-flow
      baseUri: https://{instance}.salesforce.com/services/data/v59.0
      description: "Salesforce Flow REST API for managing automation workflows"
      authentication:
        type: bearer
        token: "{{SALESFORCE_ACCESS_TOKEN}}"
      resources:
        - name: flow-definitions
          path: /sobjects/Flow
          description: "Flow definition management"
          operations:
            - name: list-flows
              method: GET
              description: "List all Flow definitions in the org"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: flow-definition
          path: /sobjects/Flow/{flowId}
          description: "Individual flow definition operations"
          operations:
            - name: get-flow
              method: GET
              description: "Get a specific Flow definition"
              inputParameters:
                - name: flowId
                  in: path
                  type: string
                  required: true
                  description: "The Salesforce ID of the Flow"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-flow
              method: PATCH
              description: "Update a Flow definition"
              inputParameters:
                - name: flowId
                  in: path
                  type: string
                  required: true
                  description: "The Salesforce ID of the Flow"
              body:
                type: json
                data:
                  Description: "{{tools.description}}"
                  Status: "{{tools.status}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: flow-interviews
          path: /sobjects/FlowInterview
          description: "Flow interview creation"
          operations:
            - name: create-flow-interview
              method: POST
              description: "Create and start a new Flow Interview"
              body:
                type: json
                data:
                  FlowDefinitionView: "{{tools.flowDefinitionView}}"
                  inputs: "{{tools.inputs}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: flow-interview
          path: /sobjects/FlowInterview/{interviewId}
          description: "Individual flow interview operations"
          operations:
            - name: get-flow-interview
              method: GET
              description: "Get the current state of a Flow Interview"
              inputParameters:
                - name: interviewId
                  in: path
                  type: string
                  required: true
                  description: "The Salesforce ID of the FlowInterview"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-flow-interview
              method: DELETE
              description: "Delete a paused Flow Interview"
              inputParameters:
                - name: interviewId
                  in: path
                  type: string
                  required: true
                  description: "The Salesforce ID of the FlowInterview"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: invocable-flows
          path: /actions/custom/flow
          description: "List invocable flow actions"
          operations:
            - name: list-invocable-flows
              method: GET
              description: "List all flows exposed as invocable actions"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: invocable-flow
          path: /actions/custom/flow/{flowApiName}
          description: "Individual invocable flow operations"
          operations:
            - name: get-invocable-flow-metadata
              method: GET
              description: "Get metadata for a specific invocable flow"
              inputParameters:
                - name: flowApiName
                  in: path
                  type: string
                  required: true
                  description: "API name of the Flow"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: invoke-flow
              method: POST
              description: "Execute a Flow as an invocable action"
              inputParameters:
                - name: flowApiName
                  in: path
                  type: string
                  required: true
                  description: "API name of the Flow to invoke"
              body:
                type: json
                data:
                  inputs: "{{tools.inputs}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: flow-query
          path: /query
          description: "SOQL query for flows"
          operations:
            - name: query-flows
              method: GET
              description: "Query flows using SOQL"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: "SOQL query string"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: salesforce-flow-rest
      resources:
        - path: /v1/flows
          name: flows
          description: "Flow definition operations"
          operations:
            - method: GET
              name: list-flows
              description: "List all Flow definitions"
              call: "salesforce-flow.list-flows"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/flows/{flowId}
          name: flow
          description: "Individual flow operations"
          operations:
            - method: GET
              name: get-flow
              description: "Get a Flow definition"
              call: "salesforce-flow.get-flow"
              with:
                flowId: "rest.flowId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PATCH
              name: update-flow
              description: "Update a Flow definition"
              call: "salesforce-flow.update-flow"
              with:
                flowId: "rest.flowId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/interviews
          name: flow-interviews
          description: "Flow interview operations"
          operations:
            - method: POST
              name: create-flow-interview
              description: "Create and start a Flow Interview"
              call: "salesforce-flow.create-flow-interview"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/interviews/{interviewId}
          name: flow-interview
          description: "Individual interview operations"
          operations:
            - method: GET
              name: get-flow-interview
              description: "Get Flow Interview state"
              call: "salesforce-flow.get-flow-interview"
              with:
                interviewId: "rest.interviewId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-flow-interview
              description: "Delete a Flow Interview"
              call: "salesforce-flow.delete-flow-interview"
              with:
                interviewId: "rest.interviewId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/invocable-flows
          name: invocable-flows
          description: "Invocable flow actions"
          operations:
            - method: GET
              name: list-invocable-flows
              description: "List invocable flow actions"
              call: "salesforce-flow.list-invocable-flows"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/invocable-flows/{flowApiName}
          name: invocable-flow
          description: "Individual invocable flow operations"
          operations:
            - method: GET
              name: get-invocable-flow-metadata
              description: "Get invocable flow metadata"
              call: "salesforce-flow.get-invocable-flow-metadata"
              with:
                flowApiName: "rest.flowApiName"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: invoke-flow
              description: "Execute a flow action"
              call: "salesforce-flow.invoke-flow"
              with:
                flowApiName: "rest.flowApiName"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: salesforce-flow-mcp
      transport: http
      tools:
        - name: list-flows
          description: "List all Flow definitions in the Salesforce org"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-flow.list-flows"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-flow
          description: "Get details for a specific Flow definition"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-flow.get-flow"
          with:
            flowId: "tools.flowId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-flow
          description: "Update a Flow definition status or description"
          hints:
            readOnly: false
            idempotent: true
          call: "salesforce-flow.update-flow"
          with:
            flowId: "tools.flowId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-flow-interview
          description: "Create and start a new Flow Interview instance"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-flow.create-flow-interview"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-flow-interview
          description: "Get the current state and outputs of a Flow Interview"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-flow.get-flow-interview"
          with:
            interviewId: "tools.interviewId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-flow-interview
          description: "Delete a paused or completed Flow Interview"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "salesforce-flow.delete-flow-interview"
          with:
            interviewId: "tools.interviewId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-invocable-flows
          description: "List all flows available as invocable actions"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-flow.list-invocable-flows"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-invocable-flow-metadata
          description: "Get input/output metadata for an invocable flow"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-flow.get-invocable-flow-metadata"
          with:
            flowApiName: "tools.flowApiName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: invoke-flow
          description: "Execute a Flow as an invocable action with input variables"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-flow.invoke-flow"
          with:
            flowApiName: "tools.flowApiName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: query-flows
          description: "Query Flow records using SOQL"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-flow.query-flows"
          with:
            q: "tools.q"
          outputParameters:
            - type: object
              mapping: "$."
